<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>约妆订单管理</title>
<style>
:root {
  --pink: #e8a0b4;
  --pink-light: #f7e0e8;
  --pink-dark: #c46a85;
  --bg: #faf5f7;
  --card: #ffffff;
  --text: #2d2327;
  --text-secondary: #8a7a80;
  --border: #f0e4e9;
  --green: #7bc4a8;
  --green-bg: #e8f5ef;
  --orange: #e8b87a;
  --orange-bg: #fdf3e6;
  --blue: #7ab8d4;
  --blue-bg: #e6f2f8;
  --red: #d47a7a;
  --red-bg: #f8e6e6;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 14px;
  --safe-bottom: env(safe-area-inset-bottom, 12px);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
.material-icons {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1em;
  overflow: hidden;
  font-size: 0 !important;
}
.material-icons::before {
  content: "•";
  font-size: 14px;
  line-height: 1;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  padding-bottom: calc(80px + var(--safe-bottom));
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea { -webkit-tap-highlight-color: transparent; }

/* Header */
.header {
  background: linear-gradient(135deg, var(--pink-dark), var(--pink));
  color: #fff;
  padding: 48px 20px 28px;
  text-align: center;
}
.header h1 { font-size: 22px; font-weight: 700; letter-spacing: 2px; }
.header p { font-size: 13px; opacity: 0.85; margin-top: 6px; }

/* Sync bar */
.sync-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 6px 16px;
  font-size: 11px;
  background: rgba(255,255,255,0.15);
  margin-top: 10px;
  border-radius: 20px;
  max-width: 280px;
  margin-left: auto;
  margin-right: auto;
  transition: all .3s;
  cursor: pointer;
}
.sync-bar .sync-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}
.sync-dot.synced { background: #7befa0; }
.sync-dot.loading { background: #f0d060; animation: pulse 0.8s infinite; }
.sync-dot.error { background: #e07777; }
.sync-dot.offline { background: #999; }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

/* Stats bar */
.stats {
  display: flex;
  gap: 10px;
  padding: 0 16px;
  margin-top: -20px;
  position: relative;
  z-index: 11;
  justify-content: center;
}
.stat-card {
  flex: 1;
  background: var(--card);
  border-radius: var(--radius);
  padding: 12px 0;
  text-align: center;
  box-shadow: var(--shadow);
}
.stat-card .num { font-size: 22px; font-weight: 700; color: var(--pink-dark); }
.stat-card .label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

/* Tabs */
.tabs {
  display: flex;
  padding: 14px 16px 8px;
  gap: 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }

.date-filter {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 16px 10px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.date-filter::-webkit-scrollbar { display: none; }
.date-filter-label { font-size: 12px; color: var(--text-secondary); white-space: nowrap; flex-shrink: 0; }
.date-filter input[type="date"] {
  padding: 6px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  font-family: inherit;
  background: var(--card);
  color: var(--text);
  outline: none;
  -webkit-appearance: none;
  flex-shrink: 0;
}
.date-btn {
  flex-shrink: 0;
  padding: 5px 12px;
  border-radius: 15px;
  font-size: 12px;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all .2s;
  white-space: nowrap;
}
.date-btn:active { opacity: 0.6; }
.date-filter .date-btn.active { background: var(--pink); color: #fff; border-color: var(--pink); }
.date-filter .date-clear { color: var(--red); border-color: var(--red); }
.tab {
  flex-shrink: 0;
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 13px;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  cursor: pointer;
  transition: all .2s;
  white-space: nowrap;
}
.tab.active {
  background: var(--pink);
  color: #fff;
  border-color: var(--pink);
}

/* Order list */
.order-list {
  padding: 4px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.order-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  position: relative;
  transition: transform .15s;
}
.order-card:active { transform: scale(0.98); }
.order-card .row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.order-card .client-info { flex: 1; min-width: 0; }
.order-card .name {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 4px;
}
.order-card .contact {
  font-size: 13px;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.order-card .contact a {
  color: var(--pink-dark);
  text-decoration: none;
}
.order-card .contact .mat-icon {
  font-size: 14px;
  vertical-align: middle;
  margin-right: 2px;
}

.status-badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  flex-shrink: 0;
}
.status-pending { background: var(--orange-bg); color: #bf8a40; }
.status-confirmed { background: var(--blue-bg); color: #5288a8; }
.status-completed { background: var(--green-bg); color: #4a9b7a; }
.status-cancelled { background: var(--red-bg); color: #b05c5c; }

.order-card .meta {
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 12px;
  color: var(--text-secondary);
}
.order-card .meta .mat-icon {
  font-size: 15px;
  vertical-align: middle;
  margin-right: 3px;
}
.order-card .notes {
  margin-top: 8px;
  padding: 8px 10px;
  background: var(--bg);
  border-radius: 8px;
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
}
.order-card .actions {
  display: flex;
  gap: 6px;
  margin-top: 10px;
  justify-content: flex-end;
}
.order-card .actions button {
  border: none;
  background: var(--bg);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 12px;
  cursor: pointer;
  color: var(--text-secondary);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: all .15s;
}
.order-card .actions button:active { opacity: 0.6; }
.order-card .actions .btn-edit { color: var(--pink-dark); background: var(--pink-light); }
.order-card .actions .btn-delete { color: var(--red); background: var(--red-bg); }

.btn-confirm {
  display: block;
  width: 100%;
  margin-top: 12px;
  padding: 10px;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  background: linear-gradient(135deg, #7bc4a8, #5aad8e);
  color: #fff;
  transition: all .15s;
  letter-spacing: 1px;
}
.btn-confirm:active { opacity: 0.7; transform: scale(0.98); }

.quick-contact {
  display: flex;
  gap: 8px;
  margin-top: 6px;
}
.quick-contact a {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 12px;
  text-decoration: none;
  background: var(--pink-light);
  color: var(--pink-dark);
}
.quick-contact .mat-icon {
  font-size: 13px;
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-secondary);
}
.empty-state .mat-icon {
  font-size: 56px;
  color: var(--border);
}
.empty-state p { margin-top: 12px; font-size: 14px; }

/* Loading skeleton */
.loading-skeleton {
  padding: 20px;
  text-align: center;
  color: var(--text-secondary);
  font-size: 14px;
}

/* FAB */
.fab {
  position: fixed;
  bottom: calc(20px + var(--safe-bottom));
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--pink), var(--pink-dark));
  color: #fff;
  border: none;
  box-shadow: 0 4px 16px rgba(200, 100, 130, 0.35);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  transition: transform .2s;
}
.fab:active { transform: scale(0.9); }
.fab .mat-icon { font-size: 28px; }

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 200;
  justify-content: center;
  align-items: flex-end;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--card);
  width: 100%;
  max-height: 92vh;
  border-radius: 20px 20px 0 0;
  padding: 24px 20px;
  overflow-y: auto;
  animation: slideUp .25s ease;
}
@keyframes slideUp {
  from { transform: translateY(40px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}
.modal h2 {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 20px;
  text-align: center;
}
.modal .form-group { margin-bottom: 16px; }
.modal label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.modal input, .modal select, .modal textarea {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 15px;
  font-family: inherit;
  background: var(--bg);
  outline: none;
  transition: border .2s;
  -webkit-appearance: none;
  appearance: none;
}
.modal input:focus, .modal select:focus, .modal textarea:focus { border-color: var(--pink); }
.modal textarea { resize: vertical; min-height: 60px; }
.modal .btn-row {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}
.modal .btn-row button {
  flex: 1;
  padding: 14px;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .15s;
}
.modal .btn-row button:active { opacity: 0.7; }
.modal .btn-cancel { background: var(--bg); color: var(--text-secondary); }
.modal .btn-save {
  background: linear-gradient(135deg, var(--pink), var(--pink-dark));
  color: #fff;
}

/* Toast */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.75);
  color: #fff;
  padding: 10px 24px;
  border-radius: 8px;
  font-size: 14px;
  z-index: 300;
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; }

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c181a;
    --card: #252023;
    --text: #ede0e5;
    --text-secondary: #9a8a90;
    --border: #352e31;
    --shadow: 0 2px 12px rgba(0,0,0,0.25);
  }
}
/* View toggle */
.view-toggle {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: 12px;
  padding-bottom: 4px;
}
.view-toggle button {
  padding: 6px 24px;
  border-radius: 16px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .2s;
  background: rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.8);
  border: 1px solid rgba(255,255,255,0.3);
  white-space: nowrap;
}
.view-toggle button.active {
  background: #fff;
  color: var(--pink-dark);
  border-color: #fff;
}

/* Income view */
.income-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 20px;
  margin: 4px 16px 12px;
  box-shadow: var(--shadow);
  text-align: center;
}
.income-card .total-amount {
  font-size: 36px;
  font-weight: 700;
  color: var(--pink-dark);
  margin: 8px 0;
}
.income-card .total-label {
  font-size: 13px;
  color: var(--text-secondary);
}
.income-list { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
.income-item {
  background: var(--card);
  border-radius: var(--radius);
  padding: 12px 16px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 12px;
}
.income-item .ii-date { font-size: 12px; color: var(--text-secondary); min-width: 80px; }
.income-item .ii-info { flex: 1; min-width: 0; }
.income-item .ii-name { font-size: 14px; font-weight: 600; }
.income-item .ii-service { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
.income-item .ii-amount {
  font-size: 18px;
  font-weight: 700;
  color: var(--green);
  white-space: nowrap;
}

/* Layout refresh */
.header {
  padding: calc(32px + env(safe-area-inset-top, 0px)) 20px 52px;
  text-align: left;
  border-radius: 0 0 28px 28px;
  box-shadow: 0 10px 30px rgba(196,106,133,.18);
}
.header h1 { font-size: 26px; letter-spacing: 1px; }
.header p { margin-top: 8px; }
.header-topline { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
.sync-bar { margin: 0; padding: 7px 12px; width:auto; flex-shrink:0; }
.view-toggle {
  margin: 22px 0 0;
  padding: 4px;
  background: rgba(255,255,255,.16);
  border-radius: 14px;
  gap: 4px;
}
.view-toggle button { flex:1; padding:9px 16px; border:0; border-radius:11px; }
.stats { margin-top: -28px; padding: 0 20px; gap: 12px; }
.stat-card { padding: 16px 8px 14px; border-radius: 16px; box-shadow: 0 8px 24px rgba(90,55,70,.08); }
.stat-card .num { font-size: 24px; }
.stat-card .label { margin-top: 4px; }
.controls { padding: 18px 16px 8px; }
.tabs { padding: 0; gap: 8px; }
.tab { flex:1; text-align:center; padding: 9px 12px; border-radius: 12px; }
.date-filter {
  margin-top: 10px;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--card);
}
.date-filter input[type="date"] { min-width: 0; flex:1; padding: 7px 8px; border:0; background:var(--bg); }
.date-btn { padding: 7px 11px; border-radius: 9px; }
.order-list { padding: 8px 16px 24px; gap: 14px; }
.order-card { padding: 18px; border-radius: 18px; box-shadow: 0 5px 20px rgba(90,55,70,.07); border:1px solid rgba(232,160,180,.1); }
.order-card .name { font-size:17px; }
.order-card .meta { margin-top:14px; gap:8px 14px; flex-wrap:wrap; line-height:1.6; }
.order-card .notes { margin-top:12px; padding:10px 12px; }
.order-card .actions { padding-top:10px; border-top:1px solid var(--border); }
.quick-contact { margin-top:10px; }
.fab { width:60px; height:60px; right:22px; bottom:calc(22px + var(--safe-bottom)); font-size:32px; font-weight:300; }
.modal-overlay { align-items:center; padding:18px; }
.modal { max-width:520px; max-height:90vh; border-radius:22px; padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px)); }
.modal h2 { text-align:left; font-size:21px; margin-bottom:22px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:0 12px; }
.form-group.full { grid-column:1 / -1; }
.modal input, .modal select, .modal textarea { min-height:46px; background:var(--card); }
.modal .btn-row { position:sticky; bottom:-24px; background:var(--card); padding-top:12px; padding-bottom:4px; }
.income-card { margin:8px 16px 14px; border-radius:18px; padding:24px; }
.income-list { gap:10px; }
.income-item { border-radius:15px; padding:14px 16px; }

@media (max-width: 360px) {
  .header-topline { display:block; }
  .sync-bar { margin-top:12px; width:max-content; }
  .stats { padding:0 12px; gap:7px; }
  .controls, .order-list { padding-left:12px; padding-right:12px; }
  .date-filter-label { display:none; }
  .form-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<div class="header">
  <div class="header-topline">
    <div>
      <h1>🌸 约妆管理</h1>
      <p>订单与收入，一目了然</p>
    </div>
    <div class="sync-bar" id="syncBar">
      <span class="sync-dot offline" id="syncDot"></span>
      <span id="syncText">加载中...</span>
    </div>
  </div>
  <div class="view-toggle">
    <button class="active" id="viewOrders" onclick="switchView('orders')">📋 订单</button>
    <button id="viewIncome" onclick="switchView('income')">💰 收入</button>
  </div>
</div>

<div class="stats" id="stats">
  <div class="stat-card"><div class="num" id="stat-all">-</div><div class="label">全部</div></div>
  <div class="stat-card"><div class="num" id="stat-pending">-</div><div class="label">待确认</div></div>
  <div class="stat-card"><div class="num" id="stat-completed">-</div><div class="label">已完成</div></div>
</div>

<div class="controls">
  <div class="tabs" id="tabs">
    <div class="tab active" data-filter="all">全部</div>
    <div class="tab" data-filter="pending">待确认</div>
    <div class="tab" data-filter="completed">已完成</div>
  </div>

  <div class="date-filter">
    <span class="date-filter-label">📅 日期</span>
    <input type="date" id="dateFilterInput">
    <button class="date-btn" id="dateTodayBtn">今天</button>
    <button class="date-btn date-clear" id="dateClearBtn">清除</button>
  </div>
</div>

<div class="order-list" id="orderList">
  <div class="loading-skeleton"><span class="material-icons" style="font-size:32px;display:block;margin-bottom:8px;">cloud_sync</span>正在同步数据...</div>
</div>

<button class="fab" id="addBtn" aria-label="新增订单">＋</button>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2 id="modalTitle">新增订单</h2>
    <div class="form-grid">
    <div class="form-group full">
      <label>客人姓名 *</label>
      <input type="text" id="inpName" placeholder="输入客人称呼">
    </div>
    <div class="form-group">
      <label>手机号</label>
      <input type="tel" id="inpPhone" placeholder="输入手机号">
    </div>
    <div class="form-group">
      <label>微信号</label>
      <input type="text" id="inpWechat" placeholder="微信号 / 二维码">
    </div>
    <div class="form-group">
      <label>约妆日期 *</label>
      <input type="date" id="inpDate">
    </div>
    <div class="form-group">
      <label>时间</label>
      <input type="time" id="inpTime">
    </div>
    <div class="form-group full">
      <label>服务项目</label>
      <input type="text" id="inpService" placeholder="输入服务项目，如日常妆、新娘妆...">
    </div>
    <div class="form-group">
      <label>金额（元）</label>
      <input type="number" id="inpAmount" placeholder="0" min="0" step="1">
    </div>
    <div class="form-group">
      <label>状态</label>
      <select id="inpStatus">
        <option value="pending">待确认</option>
        <option value="completed">已完成</option>
      </select>
    </div>
    <div class="form-group full">
      <label>备注</label>
      <textarea id="inpNotes" placeholder="化妆要求、地址、注意事项等"></textarea>
    </div>
    </div>
    <div class="btn-row">
      <button class="btn-cancel" id="cancelBtn">取消</button>
      <button class="btn-save" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ====== Local data config ======
// GitHub Pages is a public static site. Never put a write-capable token here.
const LS_CACHE_KEY = 'orders_makeup_cache';
const CACHE_VERSION = 2;

// ====== Data ======
let orders = [];
let filter = 'all';
let dateFilter = '';
let viewMode = 'orders';
let editingId = null;
let currentSha = null;
let syncStatus = 'loading'; // loading | synced | error | offline | saving

// ====== Sync Functions ======
async function syncLoad() {
  setSyncStatus('loading', '正在加载...');
  try {
    const cached = localStorage.getItem(LS_CACHE_KEY);
    const ver = parseInt(localStorage.getItem(LS_CACHE_KEY + '_ver') || '0', 10);
    if (cached && ver >= CACHE_VERSION) {
      const parsed = JSON.parse(cached);
      orders = Array.isArray(parsed) ? parsed : [];
    } else {
      orders = [];
    }
    setSyncStatus('synced', '本机数据 ✓');
  } catch (e) {
    orders = [];
    setSyncStatus('error', '本机数据读取失败');
  }
}

async function syncSave() {
  setSyncStatus('saving', '保存中...');
  try {
    localStorage.setItem(LS_CACHE_KEY, JSON.stringify(orders, null, 2));
    localStorage.setItem(LS_CACHE_KEY + '_ver', String(CACHE_VERSION));
    setSyncStatus('synced', '已保存到本机 ✓');
    return true;
  } catch (e) {
    setSyncStatus('error', '同步失败');
    showToast('⚠️ 保存失败，请检查浏览器存储权限');
    return false;
  }
}

function setSyncStatus(status, text) {
  syncStatus = status;
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  dot.className = 'sync-dot ' + status;

  if (text) txt.textContent = text;
}

// ====== UI ======
function render() {
  if (viewMode === 'income') {
    renderIncome();
    return;
  }
  const filtered = orders.filter(o => (filter === 'all' || o.status === filter) && (dateFilter === '' || o.date === dateFilter));
  const list = document.getElementById('orderList');

  if (filtered.length === 0) {
    list.innerHTML = `
      <div class="empty-state">
        <span class="material-icons">${orders.length === 0 ? 'cosmetics' : 'search_off'}</span>
        <p>${orders.length === 0 ? '还没有订单，点右下角 + 新增' : '没有符合条件的订单'}</p>
      </div>`;
  } else {
    list.innerHTML = filtered.map(o => {
      const s = statusMap[o.status] || { label: "—", cls: "status-pending" };
      const day = o.date || "待定";
  let dateDisplay = day;
  if (o.time) {
    dateDisplay = day + " " + o.time;
  }
      const svc = o.service || '未指定';
      const dateObj = o.date ? new Date(o.date + 'T12:00:00') : null;
      const weekday = dateObj ? ['日','一','二','三','四','五','六'][dateObj.getDay()] : '';
      return `<div class="order-card">
          <div class="row">
            <div class="client-info">
              <div class="name">${o.name ? esc(o.name) : "📝 未命名客人"}</div>
              <div class="contact">
                ${o.phone ? `<span><span class="material-icons mat-icon">phone</span>${esc(o.phone)}</span>` : ''}
                ${o.wechat ? `<span><span class="material-icons mat-icon">chat</span>${esc(o.wechat)}</span>` : ''}
              </div>
            </div>
            <span class="status-badge ${s.cls}">${s.label}</span>
          </div>
          <div class="meta">
            <span><span class="material-icons mat-icon">event</span>${esc(dateDisplay)}${weekday ? " 周" + weekday : ""}</span>
            <span><span class="material-icons mat-icon">spa</span>${esc(svc)}</span>
            ${o.amount ? `<span><span class="material-icons mat-icon">payments</span>¥${esc(o.amount)}</span>` : ''}
          </div>
          ${o.notes ? `<div class="notes">📝 ${esc(o.notes)}</div>` : ''}
          <div class="quick-contact">
            ${o.phone ? `<a href="tel:${esc(o.phone)}"><span class="material-icons mat-icon">call</span>打电话</a>` : ''}
            ${o.wechat ? `<a href="weixin://"><span class="material-icons mat-icon">chat</span>微信</a>` : ''}
          </div>
          ${o.status === 'pending' ? `<button class="btn-confirm" onclick="confirmOrder('${o.id}')">确认完成 ✓</button>` : ''}
          <div class="actions">
            <button class="btn-edit" onclick="editOrder('${o.id}')"><span class="material-icons" style="font-size:14px">edit</span> 编辑</button>
            <button class="btn-delete" onclick="deleteOrder('${o.id}')"><span class="material-icons" style="font-size:14px">delete</span> 删除</button>
          </div>
        </div>`;
    }).join('');
  }

  document.getElementById('stat-all').textContent = orders.length;
  document.getElementById('stat-pending').textContent = orders.filter(o => o.status === 'pending').length;
  document.getElementById('stat-completed').textContent = orders.filter(o => o.status === 'completed').length;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderIncome() {
  const completed = orders.filter(o => o.status === 'completed' && o.amount && parseFloat(o.amount) > 0 && (dateFilter === '' || o.date === dateFilter))
    .sort((a, b) => (b.date || '') < (a.date || '') ? -1 : (b.date || '') > (a.date || '') ? 1 : 0);
  const total = completed.reduce((sum, o) => sum + parseFloat(o.amount || 0), 0);

  // Update stats
  document.getElementById('stat-all').textContent = completed.length;
  document.getElementById('stat-pending').textContent = '¥' + total.toFixed(0);
  document.getElementById('stat-completed').textContent = '';

  const list = document.getElementById('orderList');
  if (completed.length === 0) {
    list.innerHTML = '<div class="empty-state"><span class="material-icons">payments</span><p>' + (dateFilter ? '该日期暂无完成收入' : '暂无完成订单的收入') + '</p></div>';
    return;
  }

  list.innerHTML = '<div class="income-card"><div class="total-label">总收入</div><div class="total-amount">¥' + total.toFixed(0) + '</div></div><div class="income-list">' +
    completed.map(o => '<div class="income-item">' +
      '<div class="ii-date">' + esc(o.date || '') + (o.time ? ' ' + esc(o.time) : '') + '</div>' +
      '<div class="ii-info"><div class="ii-name">' + (o.name ? esc(o.name) : '未命名') + '</div>' +
      '<div class="ii-service">' + (o.service ? esc(o.service) : '') + '</div></div>' +
      '<div class="ii-amount">¥' + esc(o.amount) + '</div>' +
      '</div>').join('') + '</div>';
}

function switchView(mode) {
  viewMode = mode;
  document.getElementById('viewOrders').className = mode === 'orders' ? 'active' : '';
  document.getElementById('viewIncome').className = mode === 'income' ? 'active' : '';
  // Update stat cards based on mode
  document.querySelectorAll('.stat-card').forEach((el, i) => {
    const labels = ['全部','待确认','已完成'];
    const incomeLabels = ['已完成','总收入',''];
    const isVisible = mode === 'orders' || i < 2;
    el.style.display = isVisible ? '' : 'none';
    const labelEl = el.querySelector('.label');
    if (labelEl) labelEl.textContent = mode === 'income' ? incomeLabels[i] : labels[i];
  });
  const tabsEl = document.getElementById('tabs');
  const dateFilterEl = document.querySelector('.date-filter');
  const dateLabel = document.querySelector('.date-filter-label');
  if (tabsEl) tabsEl.style.display = mode === 'orders' ? 'flex' : 'none';
  if (dateFilterEl) dateFilterEl.style.display = 'flex';
  if (dateLabel) dateLabel.textContent = mode === 'income' ? '💰' : '📅';
  render();
}

const statusMap = {
  pending: { label: '待确认', cls: 'status-pending' },
  completed: { label: '已完成', cls: 'status-completed' },
};

// ====== CRUD ======
async function addOrUpdateOrder() {
  const name = document.getElementById('inpName').value.trim();
  const phone = document.getElementById("inpPhone").value.trim();
  const time = document.getElementById("inpTime").value;
  const wechat = document.getElementById('inpWechat').value.trim();
  const date = document.getElementById('inpDate').value;
  const service = document.getElementById('inpService').value;
  const amount = document.getElementById('inpAmount').value;
  const status = document.getElementById('inpStatus').value;
  const notes = document.getElementById('inpNotes').value.trim();

  if (!date) { showToast('请选择约妆日期'); return; }

  if (editingId) {
    const idx = orders.findIndex(o => o.id === editingId);
    if (idx !== -1) {
      orders[idx] = { ...orders[idx], name, phone, time, wechat, date, service, amount, status, notes };
    }
  } else {
    orders.unshift({ id: genId(), name, phone, time, wechat, date, service, amount, status, notes, createdAt: Date.now() });
  }

  closeModal();
  render();
  await syncSave();
  showToast(editingId ? '订单已更新 ✅' : '订单已添加 ✅');
}

function editOrder(id) {
  const order = orders.find(o => o.id === id);
  if (order) openModal(order);
}

async function confirmOrder(id) {
  const idx = orders.findIndex(o => o.id === id);
  if (idx === -1) return;
  orders[idx].status = 'completed';
  render();
  await syncSave();
  showToast('已完成 ✅');
}

async function deleteOrder(id) {
  if (!confirm('确定要删除该订单吗？')) return;
  orders = orders.filter(o => o.id !== id);
  render();
  await syncSave();
  showToast('订单已删除');
}

function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}

// ====== Modal ======
function openModal(order) {
  editingId = order ? order.id : null;
  document.getElementById('modalTitle').textContent = order ? '编辑订单' : '新增订单';
  document.getElementById('inpName').value = order ? order.name : '';
  document.getElementById('inpPhone').value = order ? (order.phone || '') : '';
  document.getElementById('inpWechat').value = order ? (order.wechat || '') : '';
  document.getElementById("inpDate").value = order ? (order.date || "") : todayStr();
  document.getElementById("inpTime").value = order ? (order.time || "") : "";
  document.getElementById('inpService').value = order ? (order.service || '') : '';
  document.getElementById('inpAmount').value = order ? (order.amount || '') : '';
  
  document.getElementById('inpStatus').value = order ? (order.status || 'pending') : 'pending';
  document.getElementById('inpNotes').value = order ? (order.notes || '') : '';
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// ====== Toast ======
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ====== Init ======
async function init() {
  await syncLoad();
  render();

  // Tabs
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      filter = tab.dataset.filter;
      render();
    });
  });

  // Date filter
  document.getElementById('dateFilterInput').addEventListener('change', function() {
    dateFilter = this.value;
    render();
  });
  document.getElementById('dateTodayBtn').addEventListener('click', function() {
    const today = todayStr();
    document.getElementById('dateFilterInput').value = today;
    dateFilter = today;
    render();
  });
  document.getElementById('dateClearBtn').addEventListener('click', function() {
    document.getElementById('dateFilterInput').value = '';
    dateFilter = '';
    render();
  });

  // Modal buttons
  document.getElementById('addBtn').addEventListener('click', () => openModal(null));
  document.getElementById('cancelBtn').addEventListener('click', closeModal);
  document.getElementById('saveBtn').addEventListener('click', addOrUpdateOrder);
  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeModal();
  });

  // Keyboard
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  // Click status bar to retry reading local data
  document.getElementById('syncBar').addEventListener('click', async () => {
    if (syncStatus === 'error' || syncStatus === 'offline') {
      setSyncStatus('loading', '重新同步...');
      await syncLoad();
      render();
    }
  });
}

init();
</script>
